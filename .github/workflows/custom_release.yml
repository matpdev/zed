# Builds the personal Zed (branch `custom`) and publishes it as a GitHub release of the fork.
# Install it locally with `script/install-custom` (downloads the latest release).
name: Custom release

on:
  workflow_dispatch:
  push:
    branches: [custom]
    paths-ignore:
      - "CUSTOM.md"

concurrency:
  group: custom-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Only in the fork: never run if this file ends up upstream.
    if: github.repository == 'matpdev/zed'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CARGO_TARGET_DIR: /mnt/zed-target
      # Only the binaries are shipped; skipping DWARF saves disk space and link time.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      ZED_UPDATE_EXPLANATION: "Custom build: run script/install-custom from the zed checkout to update"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          sudo mkdir -p "$CARGO_TARGET_DIR" && sudo chown "$USER" "$CARGO_TARGET_DIR"
          df -h / /mnt

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          ./script/linux
          sudo apt-get install -y mold

      - name: Build
        run: |
          export RELEASE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | head -n1)
          mold -run cargo build --release --package zed --package cli
          df -h / /mnt

      - name: Package
        run: script/package-custom dist/zed-custom-linux-x86_64.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(tar -xzOf dist/zed-custom-linux-x86_64.tar.gz zed-custom/RELEASE)
          # Not `v*`: those tags would trigger Zed's own release workflow.
          tag="custom-$release"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/zed-custom-linux-x86_64.tar.gz \
            --target "$GITHUB_SHA" --latest \
            --title "Zed custom $release" \
            --notes "$(git log -1 --format='%s%n%n%b')"
          # Keep the 5 newest custom releases.
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("custom-"))) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
